services:
  - type: web
    name: corretor-de-arquivos-api
    env: docker
    dockerfilePath: ../unimed-tools-backend/Dockerfile
    rootDir: unimed-tools-backend
    plan: free
    envVars:
      - key: PORT
        value: 10000
  - type: static
    name: corretor-de-arquivos
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/archive-corrector/browser
    rootDir: archive-corrector
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
